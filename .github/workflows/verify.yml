name: Cross-platform verification

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q hust_reserve.py legacy_venue_search.py scheduled_reservation.py repeat_reservation.py
      - run: python hust_reserve.py --help
